name: Build and deploy Clojure app

on:
    push: 
        branches:
            - main

jobs:
    build:
        name: Build and deploy Voting buddy
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                distribution: 'temurin'
                java-version: 21

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20.x'
            - run: npm install
            
            - name: Install clojure tools
              uses: DeLaGuardo/setup-clojure@12.5
              with:
                # Install just one or all simultaneously
                # The value must indicate a particular version of the tool, or use 'latest'
                # to always provision the latest version
                cli: 1.10.1.693              # Clojure CLI based on tools.deps
                lein: 2.9.1                  # Leiningen
                boot: 2.8.3                  # Boot.clj
                bb: 0.7.8                    # Babashka
                clj-kondo: 2022.05.31        # Clj-kondo
                cljfmt: 0.10.2               # cljfmt
                cljstyle: 0.15.0             # cljstyle
                zprint: 1.2.3                # zprint

            - name: Execute clojure code
              run: clojure -e "(+ 1 1)"
                
            - name: Get leiningen version
              run: lein -v
            
            - name: Get boot version
              run: boot -V
    
            - name: Get babashka version
              run: bb --version
        
            - name: Get clj-kondo version
              run: clj-kondo --version
    
            - name: Get cljfmt version
              run: cljfmt --version
    
            - name: Get cljstyle version
              run: cljstyle version
    
            - name: Get zprint version
              run: zprint --version

            # - name: Unit Tests
            #   run: mvn -B test --file pom.xml
  
            - name: Build the application
              run: lein uberjar

            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_HUB_USERNAME }}
                password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
              with:
                images: bmads51/votingbuddy

            - name: Push to Docker Hub
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: ${{ steps.meta.outputs.tags }}

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Set up gcloud CLI
              uses: google-github-actions/setup-gcloud@v0.3.0
              with:
                project_id: ${{ secrets.GCE_PROJECT_ID }}
                service_account_key: ${{ secrets.GCE_SA_KEY }}
                export_default_credentials: true

            - name: Access gcloud CLI
              run: |
                  gcloud auth configure-docker

            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Build docker-compose.yml
              run: |
                sed "s/DOCKER_IMAGE_NAME/${{secrets.DOCKER_HUB_USERNAME}}\/${{secrets.DOCKER_IMAGE_NAME}}/g" docker-compose-template.yml > docker-compose.yml
                sed -i "s/DOCKER_CONTAINER_NAME/${{secrets.DOCKER_CONTAINER_NAME}}/g" docker-compose.yml
      
            - name: scp into GCP instance
              uses: appleboy/scp-action@master
              with:
                host: ${{ secrets.GCE_INSTANCE_IP }}
                username: ${{ secrets.GCE_SSH_USERNAME }}
                key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
                source: "docker-compose.yml"
                target: "/home/${{ secrets.GCE_SSH_USERNAME }}/"
  
            - name: SSH into GCP instance and deploy Django
              uses: appleboy/ssh-action@master
              with:
                host: ${{ secrets.GCE_INSTANCE_IP }}
                username: ${{ secrets.GCE_SSH_USERNAME }}
                key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
                script: |
                  docker compose -f /home/${{ secrets.GCE_SSH_USERNAME }}/docker-compose.yml down
                  docker compose -f /home/${{ secrets.GCE_SSH_USERNAME }}/docker-compose.yml build --pull
                  docker compose -f /home/${{ secrets.GCE_SSH_USERNAME }}/docker-compose.yml up -d

                  docker image prune -f


            






              




            









